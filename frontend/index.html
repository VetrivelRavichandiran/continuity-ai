<!doctype html>
<html lang="en" data-theme="dark" style="background-color: #101827">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CONTINUITY AI — project knowledge-continuity platform. Extract, connect, verify and hand over the knowledge behind the work."
    />

    <script>
      try {
        var t = localStorage.getItem('continuity-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
